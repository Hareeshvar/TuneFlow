# Local MySQL database configuration
spring.datasource.url=jdbc:mysql://localhost:3306/tuneflow?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=

# Keep ddl-auto as update so Hibernate creates the tables locally
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
